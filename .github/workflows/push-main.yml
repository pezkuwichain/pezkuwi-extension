name: Main
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Builds the store packages from what was merged. Publishing to the Chrome
  # Web Store and Firefox Add-ons is a manual release step: the version in
  # package.json and both manifests is set in the release PR, not here.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Build
      run: |
        corepack enable
        yarn install --immutable
        yarn build

    - name: Check built manifests
      run: python3 scripts/check-built-manifests.py . $(cat scripts/published-packages.txt)

    - name: Upload Chrome package
      uses: actions/upload-artifact@v4
      with:
        name: chrome-${{ github.sha }}
        path: |
          master-chrome-build.zip
          master-chrome-src.zip
        if-no-files-found: error

    - name: Upload Firefox package
      uses: actions/upload-artifact@v4
      with:
        name: firefox-${{ github.sha }}
        path: |
          master-ff-build.zip
          master-ff-src.zip
        if-no-files-found: error
